# Publishes the bridge's container image to the GitHub Container Registry.
# Runs when a tag like bridge-v0.1.0 is pushed, or by hand from the Actions tab.
name: Bridge image

on:
  push:
    tags: ['bridge-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wrkbench-bridge
          tags: |
            type=match,pattern=bridge-v(.*),group=1
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bridge/Dockerfile
          # Raspberry Pi (64- and 32-bit) as well as ordinary PCs.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
